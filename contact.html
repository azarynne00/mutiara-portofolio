        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg fixed-top">

    <div class="container">

        <a class="navbar-brand" href="index.html">
            Dita.
        </a>


        <button
            class="navbar-toggler"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav">

            <i class="fa-solid fa-bars"></i>

        </button>


        <div

            <div class="navbar-nav ms-auto">

                <a class="nav-link" href="index.html">

                </a>

            </div>

        </div>

    </div>

</nav>



<main class="inner-page">

    <div class="container">


        <div class="page-heading">

            <span>
                SAY HELLO
            </span>

            <h1>
                Contact
            </h1>

            <p>
                Have a project in mind?
                Let's talk.
            </p>

        </div>


        <form
            class="contact-form"
            id="contactForm">


            <div class="row g-4">


                <div class="col-md-6">

                    <label>
                        Nama
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        placeholder="Nama kamu"
                        required>

                </div>


                <div class="col-md-6">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="email@example.com"
                        required>

                </div>


                <div class="col-12">

                    <label>
                        Subject
                    </label>

                    <input
                        type="text"
                        name="subject"
                        class="form-control"
                        placeholder="Subject"
                        required>

                </div>


                <div class="col-12">

                    <label>
                        Message
                    </label>

                    <textarea
                        name="message"
                        rows="7"
                        class="form-control"
                        placeholder="Tulis pesan kamu..."
                        required></textarea>

                </div>


                <div class="col-12 text-center">

                    <button
                        type="submit"
                        class="btn-cottage btn-pink">

                        Send Message
                        <i class="fa-solid fa-paper-plane"></i>

                    </button>

                </div>


            </div>

        </form>

    </div>

</main>



<!-- BACK TO TOP -->
